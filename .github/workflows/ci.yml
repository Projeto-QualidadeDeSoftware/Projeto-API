name: CI

# Integração contínua: roda em todo push e pull request para main e develop.
# Compila, executa todos os testes automatizados e confere a cobertura mínima.
# Os testes usam banco H2 em memória, então não é preciso subir MySQL aqui.

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Testes, cobertura e build
        run: ./mvnw -B verify

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: target/site/jacoco
          if-no-files-found: ignore
