name: CD

# Entrega contínua: a cada alteração na main
#   1. testa e gera a imagem Docker (publicada no GitHub Container Registry);
#   2. publica automaticamente em HOMOLOGAÇÃO, na VPS;
#   3. espera a aprovação de um integrante do grupo e então publica em PRODUÇÃO.
#
# A aprovação é configurada no GitHub, em Settings > Environments > producao
# (Required reviewers). O acesso à VPS usa os secrets VPS_HOST, VPS_USUARIO e VPS_CHAVE_SSH.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Um deploy por vez: o próximo espera o anterior terminar.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.imagem.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Testes, cobertura e build
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # O nome da imagem precisa estar em minúsculas; a mesma imagem (identificada
      # pelo commit) é a que vai para homologação e depois para produção.
      - name: Definir nome da imagem
        id: imagem
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "image=$base:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar a imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imagem.outputs.image }}
            ${{ steps.imagem.outputs.base }}:latest

  deploy-homologacao:
    name: Deploy em homologação
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: ${{ vars.APP_URL }}

    steps:
      - name: Configurar acesso SSH à VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_CHAVE_SSH: ${{ secrets.VPS_CHAVE_SSH }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_CHAVE_SSH" ]; then
            echo "::error::Defina os secrets VPS_HOST, VPS_USUARIO e VPS_CHAVE_SSH"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_CHAVE_SSH" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publicar a imagem em homologação
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USUARIO: ${{ secrets.VPS_USUARIO }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/vps "$VPS_USUARIO@$VPS_HOST" \
            "cd ~/Projeto-API && git pull --ff-only && bash deploy/atualizar.sh homologacao $IMAGE"

      - name: Conferir se a API respondeu
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for tentativa in $(seq 1 30); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/actuator/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::A API não respondeu em $APP_URL/actuator/health"
          exit 1

  deploy-producao:
    name: Deploy em produção
    needs: [build, deploy-homologacao]
    runs-on: ubuntu-latest
    # Este environment tem "Required reviewers": o job fica parado até alguém do grupo aprovar.
    environment:
      name: producao
      url: ${{ vars.APP_URL }}

    steps:
      - name: Configurar acesso SSH à VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_CHAVE_SSH: ${{ secrets.VPS_CHAVE_SSH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_CHAVE_SSH" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Publicar a imagem em produção
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USUARIO: ${{ secrets.VPS_USUARIO }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/vps "$VPS_USUARIO@$VPS_HOST" \
            "cd ~/Projeto-API && bash deploy/atualizar.sh producao $IMAGE"

      - name: Conferir se a API respondeu
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for tentativa in $(seq 1 30); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/actuator/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::A API não respondeu em $APP_URL/actuator/health"
          exit 1
