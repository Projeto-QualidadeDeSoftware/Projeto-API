name: CD

# Entrega contínua: a cada alteração na main
#   1. testa e gera a imagem Docker (publicada no GitHub Container Registry);
#   2. publica automaticamente em STAGE;
#   3. espera a aprovação de um integrante do grupo e então publica em PRODUÇÃO.
#
# A aprovação é configurada no GitHub, em Settings > Environments > production
# (Required reviewers).

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Um deploy por vez: o próximo espera o anterior terminar.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Testar e gerar imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.imagem.outputs.image }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Testes, cobertura e build
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # O nome da imagem precisa estar em minúsculas; a mesma imagem (identificada
      # pelo commit) é a que vai para stage e depois para produção.
      - name: Definir nome da imagem
        id: imagem
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar a imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.imagem.outputs.image }}

  deploy-stage:
    name: Deploy em stage
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: stage
      url: ${{ vars.APP_URL }}

    steps:
      - name: Publicar a imagem em stage
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Defina o secret DEPLOY_HOOK_URL no environment 'stage'"
            exit 1
          fi
          curl --fail --silent --show-error --get "$DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE"

      - name: Conferir se a API respondeu
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for tentativa in $(seq 1 30); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/actuator/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::A API não respondeu em $APP_URL/actuator/health"
          exit 1

  deploy-producao:
    name: Deploy em produção
    needs: deploy-stage
    runs-on: ubuntu-latest
    # Este environment tem "Required reviewers": o job fica parado até alguém do grupo aprovar.
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Publicar a imagem em produção
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Defina o secret DEPLOY_HOOK_URL no environment 'production'"
            exit 1
          fi
          curl --fail --silent --show-error --get "$DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE"

      - name: Conferir se a API respondeu
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for tentativa in $(seq 1 30); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$APP_URL/actuator/health" || true)
            echo "Tentativa $tentativa: HTTP $codigo"
            if [ "$codigo" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::A API não respondeu em $APP_URL/actuator/health"
          exit 1
