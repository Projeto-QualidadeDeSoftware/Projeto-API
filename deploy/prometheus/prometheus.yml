global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-producao:8080"]
        labels:
          ambiente: producao
      - targets: ["api-homologacao:8080"]
        labels:
          ambiente: homologacao

  - job_name: banco
    static_configs:
      - targets: ["monitor-banco:9104"]

  - job_name: servidor
    static_configs:
      - targets: ["monitor-servidor:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
