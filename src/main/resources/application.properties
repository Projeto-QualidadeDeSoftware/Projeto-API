spring.application.name=projeto

# Porta: plataformas de hospedagem informam a porta pela variável PORT
server.port=${PORT:8080}

# Atrás do proxy (Caddy) o IP real do cliente e o https chegam nos cabeçalhos X-Forwarded-*
server.forward-headers-strategy=native

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/projeto}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# ---------------------------------------------------------------
# Os valores abaixo servem SOMENTE para desenvolvimento local.
# Em homologação e produção eles são obrigatoriamente lidos de variáveis
# de ambiente (ver application-homologacao.properties e application-producao.properties).
# ---------------------------------------------------------------

# Login (JWT)
app.jwt.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento-local-0123456789}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}

# Primeiro usuário, criado apenas quando não existe nenhum funcionário
app.admin.cpf=${ADMIN_CPF:00000000000}
app.admin.senha=${ADMIN_SENHA:admin123}

# Endereços do front web autorizados a chamar a API pelo navegador (CORS)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

# Assistente de IA (Mistral). Sem chave, o endpoint responde 503.
mistral.url=https://api.mistral.ai
mistral.api-key=${MISTRAL_API_KEY:}
mistral.modelo=${MISTRAL_MODELO:ministral-8b-2512}

# Logs: além do console, gravados em arquivo com rotação (10 MB por arquivo, 30 arquivos)
logging.file.name=${LOG_ARQUIVO:logs/projeto.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.level.com.silva.projeto=INFO

# Monitoramento: saúde, informações e métricas no formato do Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Documentação da API (Swagger)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
