spring.application.name=projeto

# Porta: plataformas de hospedagem informam a porta pela variável PORT
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/projeto
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# ---------------------------------------------------------------
# Os valores abaixo servem SOMENTE para desenvolvimento local.
# Em stage e produção eles são obrigatoriamente lidos de variáveis
# de ambiente (ver application-stage.properties e application-prod.properties).
# ---------------------------------------------------------------

# Login (JWT)
app.jwt.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento-local-0123456789}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:480}

# Primeiro usuário, criado apenas quando não existe nenhum funcionário
app.admin.cpf=${ADMIN_CPF:00000000000}
app.admin.senha=${ADMIN_SENHA:admin123}

# Endereços do front web autorizados a chamar a API pelo navegador (CORS)
app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

# Assistente de IA (Mistral). Sem chave, o endpoint responde 503.
mistral.url=https://api.mistral.ai
mistral.api-key=${MISTRAL_API_KEY:}
mistral.modelo=${MISTRAL_MODELO:ministral-8b-2512}
