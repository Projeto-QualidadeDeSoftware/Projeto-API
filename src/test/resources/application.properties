# Configuração usada apenas pelos testes automatizados:
# banco H2 em memória (não precisa de MySQL) e nenhuma chamada real à Mistral.

spring.datasource.url=jdbc:h2:mem:projeto-${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=segredo-usado-somente-nos-testes-automatizados-0123456789
app.jwt.expiracao-minutos=60

app.admin.cpf=00000000000
app.admin.senha=admin123

app.cors.origens-permitidas=http://localhost:5173

mistral.url=https://api.mistral.ai
mistral.api-key=
mistral.modelo=mistral-small-latest
